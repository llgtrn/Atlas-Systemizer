[package]
name = "adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# External mechanics live here: filesystem, Git, parsers, build tools and provider boundaries.
# Adapter output becomes typed Atlas facts; adapter mechanics never define the canonical model.

[dependencies]
atlas_core = { package = "core", path = "../core" }
serde = { workspace = true }

# Real Rust parser for the R4.3 semantic extractor (`adapter/src/semantic/rust/`). Already present
# in Cargo.lock transitively via `serde_derive` at these exact versions; declaring them directly
# here only enables additional features on an already-resolved dependency graph, it does not add a
# new crate. Chosen over regex/ad-hoc parsing per `.atlas/contracts/SEMANTIC-EXTRACTION.md`: a real
# AST is required, and `syn` is the de facto standard one for Rust source.
syn = { version = "3.0.6", features = ["full", "visit"] }
quote = "1.0.47"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# G152 (ADR 0068): syntax substrate for the TypeScript/JavaScript extractor
# (`adapter/src/semantic/typescript/`). tree-sitter and both grammars are MIT-licensed; they only
# parse -- every semantic record and obligation is Atlas's own. A parse is never semantic support.
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
# G163 (ADR 0078): data-only JSON for the SafeTensors header (`src/weights/safetensors.rs`). Already
# resolved through `core`; declaring it here adds no crate. The header is parsed as data and
# checked field by field -- nothing in a weight container is executed or deserialized into code.
serde_json = { workspace = true }

[build-dependencies]
# build.rs digests the extractor sources with Atlas's own BLAKE3 (ADR 0008).
atlas_core = { package = "core", path = "../core" }

[dev-dependencies]
# The independent dependency-census differential oracle (`src/dependency/cargo_oracle.rs`) parses
# `cargo metadata`'s JSON output in tests only: `census_cargo_workspace` never runs cargo, matching
# the "ingestion is not execution" security boundary this oracle deliberately sits outside of.
# (serde_json itself is a production dependency since G163, for the SafeTensors header.)
