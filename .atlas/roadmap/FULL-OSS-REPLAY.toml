# FULL_OSS_REPLAY (G151, ADR 0067): every canonical donor replayed through successively stronger
# Atlas capability epochs. Generated from the union of the donor ledgers (donor corpus, First-50,
# capability audit, repo-exact frontier, revalidation, working set, campaign and provenance records)
# deduplicated by remote, plus explicitly authorized donors. A verdict is valid at the epoch that
# decided it; newer decisions append, history is never rewritten.

