# REMOVE ACCIDENTAL COMPLEXITY AGGRESSIVELY. CONQUER ESSENTIAL COMPLEXITY DELIBERATELY.
# NEVER CONFUSE THE TWO.
#
# The essential complexity debt ledger (G116, extended by the G118 hard-stop audit). One [[debt]] per
# ESSENTIAL capability that is not closed; [[scale_trigger]] / [[scale_threshold]] for SCALE_TRIGGERED
# capabilities; [[native_attack]] is the ordered queue that preempts donor progression.
# Escalation of an OPEN debt by stale_generations (generations since its last material advance),
# derived from the ledger: healthy native-attack gap 12 (G62->G74), failure run 32 (G84-G115):
#   stale < 13 TRACK | >= 13 REVIEW_REQUIRED | >= 25 PRIORITY_ESCALATION | >= 32 BLOCK_NEW_DONOR_PROGRESS
# Skip budget: 3 consecutive donor decisions after the last advance that leave a debt unchanged.
# Any OPEN debt at BLOCK_NEW_DONOR_PROGRESS or past its skip budget blocks donor progression
# (FOUNDATIONAL-ATLAS-READY.toml [donor_progression]); runtime tests recompute every state from the
# ledger head. A debt leaves the ledger only as CLOSED (NATIVE_SOLUTION, PERMANENT_EXTERNAL_BOUNDARY
# or PROVEN_ALTERNATIVE) with repository evidence that is not a donor decision.

