[reconciliation]
reconstructed_named_total = 119
repo_exact_total = 153
named_total_reproducible_from_repository = false
explanation = "the 119 was counted from project context outside this repository; the repo-exact total is computed from every named project the repository records. It differs because (a) ecosystem names (WebAssembly, Sigstore, OpenTelemetry, ROS 2, Higgsfield) expand to several repositories, (b) subtree names (MLIR, Cranelift, WASI) collapse into their parent repository, (c) investigation lanes recorded alternates and dependencies (e.g. nsjail, bubblewrap, stan-dev/math, urdfdom, OMCompiler) and rejected/provider repositories (higgsfield-ai/*, unlicensed clones), and (d) ISAs, formats and algorithms are named but are not repositories"
unrecorded_names_action = "any of the 119 names absent from the entries below has no record in this repository; add it with a quote-backed source and a verified canonical_url"

